<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FALLS RP — загрузка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            background: radial-gradient(ellipse at 30% 40%, #0a0e1a, #020408);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ambient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 50%, rgba(204,0,0,0.2), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .menu {
            position: relative;
            z-index: 10;
            width: 720px;
            max-width: 90vw;
            background: rgba(10, 15, 28, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            border: 1px solid rgba(204, 0, 0, 0.4);
            box-shadow: 0 30px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(204,0,0,0.2) inset;
            padding: 35px 30px 45px;
            text-align: center;
        }

        .logo {
            font-size: 4.8rem;
            font-weight: 800;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ffffff 20%, #e68a8a 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .sub {
            font-size: 0.85rem;
            color: #b0bbdd;
            border-top: 1px dashed rgba(204,0,0,0.5);
            display: inline-block;
            padding-top: 12px;
            margin-bottom: 25px;
        }

        .tagline {
            background: rgba(0,0,0,0.5);
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 0.95rem;
            color: #d4cfcf;
            margin-bottom: 35px;
            display: inline-block;
        }

        .load-area {
            margin: 25px 0 20px;
        }
        .load-bar {
            width: 100%;
            height: 8px;
            background: #1a1f30;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 1px 4px #00000066;
        }
        .load-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #cc0000, #ff6a6a, #cc0000);
            border-radius: 20px;
            animation: loadingAnim 2s infinite ease;
            box-shadow: 0 0 6px #ff3333;
        }
        @keyframes loadingAnim {
            0% { width: 5%; opacity: 0.7; }
            50% { width: 70%; opacity: 1; }
            100% { width: 95%; opacity: 0.7; }
        }

        .percent {
            font-family: monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ff8a8a;
            margin-top: 12px;
        }
        .status {
            font-size: 0.8rem;
            color: #8f9bc2;
            margin-top: 8px;
        }

        .discord-block {
            margin-top: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 48px;
            padding: 12px 20px;
            flex-wrap: wrap;
        }
        .qr {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 16px;
            padding: 5px;
            /* обводка убрана */
        }
        .qr img {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }
        .discord-text {
            text-align: left;
            color: #e0e6ff;
        }
        .discord-text strong {
            color: #cc0000;
        }

        .version {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.65rem;
            color: #4b567f;
        }

        @media (max-width: 600px) {
            .logo { font-size: 3rem; letter-spacing: 3px; }
            .menu { padding: 25px 20px 35px; }
            .discord-block { flex-direction: column; text-align: center; gap: 10px; }
            .discord-text { text-align: center; }
        }
    </style>
</head>
<body>
<div class="ambient"></div>

<div class="menu">
    <div class="logo">FALLS RP</div>
    <div class="sub">Light Rp</div>
    <div class="tagline">⚔️ CRIMES · BUSINESS · POWER ⚔️</div>

    <div class="load-area">
        <div class="load-bar">
            <div class="load-fill" id="loadFill"></div>
        </div>
        <div class="percent" id="percentValue">0%</div>
        <div class="status" id="statusMsg">Ожидание подключения...</div>
    </div>

    <div class="discord-block">
        <div class="qr">
            <img id="qrImage" alt="Discord QR">
        </div>
        <div class="discord-text">
            <strong>⚡ НАШ DISCORD ⚡</strong><br>
            Присоединяйся!<br>
            <small>новости, ивенты, общение</small>
        </div>
    </div>
</div>
<div class="version">FALLS RP ENGINE v2.6</div>

<script>
    // Генерация QR-кода
    const discordUrl = "https://discord.gg/P6QKzVJA";
    const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(discordUrl)}`;
    document.getElementById('qrImage').src = qrApi;

    // Функция для обновления прогресса (вызывается из Lua)
    window.UpdateProgress = function(percent, text) {
        var fill = document.getElementById('loadFill');
        var percentSpan = document.getElementById('percentValue');
        var statusSpan = document.getElementById('statusMsg');
        if(fill) fill.style.width = percent + '%';
        if(percentSpan) percentSpan.innerText = percent + '%';
        if(statusSpan && text) statusSpan.innerText = text;
        // Если дошли до 100%, можно остановить анимацию (но она и так перестанет быть видна)
        if(percent >= 100 && fill) {
            fill.style.animation = 'none';
        }
    };

    // Эмуляция (на случай, если Lua не пришлёт данные)
    let p = 0;
    let interval = setInterval(() => {
        if(p >= 100) clearInterval(interval);
        else {
            p += Math.random() * 8 + 2;
            if(p > 100) p = 100;
            if(typeof UpdateProgress === 'function') UpdateProgress(Math.floor(p), "Загрузка...");
        }
    }, 400);
</script>
</body>
</html>
